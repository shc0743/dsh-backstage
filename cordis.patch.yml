# Backstage patches the shipped PowerShell executor in place at runtime
# (`resolve` / `argv` / `confine` on its prototype) instead of replacing the
# `shell` service. A service replacement cannot take over from an already
# running provider, which is why the first design failed to enable live with
# "service shell has been registered". Patches are restored when the plugin
# unloads, so enabling and disabling this bundle takes effect immediately.
#
# The row is Windows-only; other platforms keep the shipped bash executor.
- insert:
    - id: backstage
      name: dsh-backstage
      disabled: !!js process.platform !== 'win32'
