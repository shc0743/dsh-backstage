# Backstage bundle.
#
# The shipped `pwsh-sandbox` row cannot be renamed by a patch (a truthy `name`
# only asserts the existing name), so it is disabled and this bundle inserts
# its own executor row. The row is Windows-only; other platforms keep the
# shipped bash executor.
- id: pwsh-sandbox
  disabled: true
- insert:
    - id: backstage
      name: dsh-backstage
      disabled: !!js process.platform !== 'win32'
